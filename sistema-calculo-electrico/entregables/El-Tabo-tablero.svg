"#244c68" font-family="Consolas,monospace" font-size="12">C5 · Control · 1F · 6 A · 1.5 mm² · Id 0,14 A</text><text data-layer="CIRCUITO_005" x="175" y="871" fill="#244c68" font-family="Consolas,monospace" font-size="11">Fase propuesta: L2 · Con respaldo solicitado</text><text data-layer="CIRCUITO_005" x="175" y="891" fill="#244c68" font-family="Consolas,monospace" font-size="11">[Hoja1!23] Tablero Transferencia · Cant. 1 × 30 W = 30 W · Sala de Monitoreo · Grupo Generador</text><line data-layer="GABINETE" x1="50" y1="902" x2="1240" y2="902" stroke="#65716a" stroke-width="1.3"/><text data-layer="TEXTO" x="50" y="937" fill="#263238" font-family="Consolas,monospace" font-size="12">Reservas propuestas: 1 posiciones de circuito. Módulos y gabinete por definir.</text><line data-layer="PROTECCIONES" x1="50" y1="972" x2="230" y2="972" stroke="#244c68" stroke-width="1.3"/><line data-layer="PROTECCIONES" x1="230" y1="972" x2="230" y2="1002" stroke="#244c68" stroke-width="1.3"/><line data-layer="PROTECCIONES" x1="230" y1="1002" x2="50" y2="1002" stroke="#244c68" stroke-width="1.3"/><line data-layer="PROTECCIONES" x1="50" y1="1002" x2="50" y2="972" stroke="#244c68" stroke-width="1.3"/><text data-layer="PROTECCIONES" x="58" y="991" fill="#244c68" font-family="Consolas,monospace" font-size="11">BARRA N</text><line data-layer="TIERRA" x1="270" y1="972" x2="450" y2="972" stroke="#28713f" stroke-width="1.3"/><line data-layer="TIERRA" x1="450" y1="972" x2="450" y2="1002" stroke="#28713f" stroke-width="1.3"/><line data-layer="TIERRA" x1="450" y1="1002" x2="270" y2="1002" stroke="#28713f" stroke-width="1.3"/><line data-layer="TIERRA" x1="270" y1="1002" x2="270" y2="972" stroke="#28713f" stroke-width="1.3"/><text data-layer="TIERRA" x="278" y="991" fill="#28713f" font-family="Consolas,monospace" font-size="11">BARRA PE</text><line data-layer="TIERRA" x1="420" y1="1002" x2="420" y2="1020" stroke="#28713f" stroke-width="1.3"/><line data-layer="TIERRA" x1="411" y1="1020" x2="429" y2="1020" stroke="#28713f" stroke-width="1.3"/><line data-layer="TIERRA" x1="414" y1="1025" x2="426" y2="1025" stroke="#28713f" stroke-width="1.3"/><line data-layer="TIERRA" x1="417" y1="1030" x2="423" y2="1030" stroke="#28713f" stroke-width="1.3"/><line data-layer="RESPALDO" x1="50" y1="1052" x2="190" y2="1052" stroke="#ad5018" stroke-width="1.3"/><line data-layer="RESPALDO" x1="190" y1="1052" x2="190" y2="1090" stroke="#ad5018" stroke-width="1.3"/><line data-layer="RESPALDO" x1="190" y1="1090" x2="50" y2="1090" stroke="#ad5018" stroke-width="1.3"/><line data-layer="RESPALDO" x1="50" y1="1090" x2="50" y2="1052" stroke="#ad5018" stroke-width="1.3"/><text data-layer="RESPALDO" x="58" y="1075" fill="#ad5018" font-family="Consolas,monospace" font-size="11">UPS 2 kVA</text><text data-layer="RESPALDO" x="220" y="1076" fill="#ad5018" font-family="Consolas,monospace" font-size="12">Alimentada desde C2 · Salida: Cargas críticas (rack / sala de monitoreo)</text><line data-layer="GABINETE" x1="30" y1="155" x2="1260" y2="155" stroke="#65716a" stroke-width="1.3"/><line data-layer="GABINETE" x1="1260" y1="155" x2="1260" y2="1144" stroke="#65716a" stroke-width="1.3"/><line data-layer="GABINETE" x1="1260" y1="1144" x2="30" y2="1144" stroke="#65716a" stroke-width="1.3"/><line data-layer="GABINETE" x1="30" y1="1144" x2="30" y2="155" stroke="#65716a" stroke-width="1.3"/><text data-layer="TEXTO" x="30" y="1186" fill="#263238" font-family="Consolas,monospace" font-size="12">OBSERVACIONES DE DISEÑO</text><text data-layer="TEXTO" x="30" y="1209" fill="#263238" font-family="Consolas,monospace" font-size="11">Esquema de anteproyecto sin escala física. Símbolos simplificados. Calibres y protecciones provienen del cálculo orientativo de la aplicación.</text><text data-layer="TEXTO" x="30" y="1226" fill="#263238" font-family="Consolas,monospace" font-size="11">El Excel no define sensibilidad de diferenciales, poder de corte, curvas, neutro, PE, borneras ni dimensiones comerciales. Confirmar en</text><text data-layer="TEXTO" x="30" y="1243" fill="#263238" font-family="Consolas,monospace" font-size="11">ingeniería.</text><text data-layer="TEXTO" x="30" y="1260" fill="#263238" font-family="Consolas,monospace" font-size="11">Generador, ATS y UPS se representan según la configuración del proyecto. Sus capacidades y conexiones no se obtienen del listado de consumos.</text><text data-layer="TEXTO" x="30" y="1277" fill="#263238" font-family="Consolas,monospace" font-size="11">El cálculo original del alimentador supone demanda trifásica equilibrada. Verificar la corriente máxima real por fase antes de dimensionar.</text><text data-layer="TEXTO" x="30" y="1294" fill="#263238" font-family="Consolas,monospace" font-size="11">Revisar compatibilidad: generador 1F y alimentación 3F. La transferencia requiere definición de ingeniería.</text><text data-layer="TEXTO" x="30" y="1311" fill="#263238" font-family="Consolas,monospace" font-size="11">Faltan longitudes de circuitos: caída de tensión sin verificar en esos ramales.</text><text data-layer="TEXTO" x="42" y="1362" fill="#263238" font-family="Consolas,monospace" font-size="11">Proyecto: Sala de Monitoreo El Tabo</text><text data-layer="TEXTO" x="42" y="1379" fill="#263238" font-family="Consolas,monospace" font-size="11">Cliente: Por definir</text><text data-layer="TEXTO" x="42" y="1396" fill="#263238" font-family="Consolas,monospace" font-size="11">Ubicación: Por definir</text><text data-layer="TEXTO" x="42" y="1413" fill="#263238" font-family="Consolas,monospace" font-size="11">Responsable: Por definir</text><text data-layer="TEXTO" x="42" y="1430" fill="#263238" font-family="Consolas,monospace" font-size="11">Fecha: 2026-11-23</text><text data-layer="TEXTO" x="42" y="1447" fill="#263238" font-family="Consolas,monospace" font-size="11">Referencia: Por definir</text><text data-layer="TEXTO" x="42" y="1464" fill="#263238" font-family="Consolas,monospace" font-size="11">Tablero: TD-1</text><text data-layer="TEXTO" x="42" y="1481" fill="#263238" font-family="Consolas,monospace" font-size="11">Estado: ANTEPROYECTO · SIN ESCALA</text><line data-layer="CAJETIN" x1="30" y1="1340" x2="1270" y2="1340" stroke="#263238" stroke-width="1.3"/><line data-layer="CAJETIN" x1="1270" y1="1340" x2="1270" y2="1508" stroke="#263238" stroke-width="1.3"/><line data-layer="CAJETIN" x1="1270" y1="1508" x2="30" y2="1508" stroke="#263238" stroke-width="1.3"/><line data-layer="CAJETIN" x1="30" y1="1508" x2="30" y2="1340" stroke="#263238" stroke-width="1.3"/></svg>